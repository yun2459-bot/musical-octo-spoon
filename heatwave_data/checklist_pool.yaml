# 재해유형(기상특보 코드)별·등급별 점검 체크리스트 항목 풀.
#
# AI/자동화는 이 풀에 있는 항목을 "조합"만 한다 — 새 항목을 즉흥적으로 만들지
# 않는다. 법정 안전조치 근거가 있어야 감사·소송 때 방어가 되기 때문(2026-08-10
# 설계 원칙). 항목 자체는 아래 items에 정의하고, 위 코드별 절에서는 id만 나열한다.
#
# 근거가 확인되지 않은 재해유형(한파/대설/강풍/황사/안개/지진해일/폭풍해일/건조/
# 풍랑)은 일부러 비워뒀다 — 확인 안 된 항목을 지어내는 대신 "점검항목 미정"으로
# 보여준다. 근거 자료를 찾으면 그때 추가할 것.

H:  # 폭염 — 세방(주) 온열질환 예방지침 REV2 (기존 체크리스트, 이미 시스템에 있음)
  주의보: [물, 바람그늘, 휴식, 비상물품교육, 민감군]
  경보: [물, 바람그늘, 휴식, 비상물품교육, 민감군]
  중대경보: [물, 바람그늘, 휴식, 비상물품교육, 민감군]

T:  # 태풍 — 고용노동부 "폭염·호우·태풍 대비 사업장 안전보건 조치사항"(2026)
  주의보: [침수붕괴방지, 강풍대비, 대피경보공유, 비상용품비치]
  경보: [침수붕괴방지, 강풍대비, 대피경보공유, 비상용품비치, 감전예방, 작업중지판단]

R:  # 호우 — 고용노동부 "폭염·호우·태풍 대비 사업장 안전보건 조치사항"(2026)
  주의보: [침수붕괴방지, 강풍대비, 대피경보공유, 비상용품비치, 하천모니터링]
  경보: [침수붕괴방지, 강풍대비, 대피경보공유, 비상용품비치, 하천모니터링, 감전예방, 작업중지판단]

FIRE:  # 화재(뉴스 감지, KMA 특보 아님) — 2026-08-13 사용자 제공 실제 화재 뉴스
       # 8건으로 처음 만들었다가, "너무 길어서 아무도 안 읽는다"는 지적을
       # 받고 화기작업(용접·용단) 안전조치 3대 원칙(위험물·가연물 이격 /
       # 불티비산방지 / 소화기)으로 압축했다. 이 3원칙은 뉴스가 아니라 산업
       # 안전보건기준에 관한 규칙 제241조·제241조의2(화재감시자)에 실제로
       # 규정된 법정 의무라 근거가 더 탄탄해졌다(2026-08-13 웹검색으로 조문
       # 확인). 위험물(fire_hazard_tags에 위험물/화학물질/가스/인화성물질이
       # 있을 때)/창고물류(태그가 창고·물류일 때)/인근지역(그 외 기본값)
       # 3단계로 report_sources.py가 자동 선택한다.
  인근지역: [화재_창문닫기, 화재_소방차진입로]
  창고물류: [화재_위험물가연물, 화재_불티비산방지, 화재_소화기]
  위험물: [화재_위험물가연물, 화재_불티비산방지, 화재_전용소화설비]

