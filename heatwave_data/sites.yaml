# 관제 대상 사업장 목록 — 세방(주) 사업장 주소지 확인_240819.xlsx 기준으로 지사별 도시 단위로 묶음.
#
# 지사 순서: 경인/광양/부산/전북/경남/울산/강원/경북/목포/당진/삼천포 (2026-07-31 지정 순서 고정 —
# 구글폼 드롭다운과 동일 순서이므로 임의로 재배열하지 말 것)
#
# stn: 기상청 방재기상관측(AWS/ASOS) 지점번호. null이면 아직 관측지점을 확정하지 못한 도시로,
#      실시간 온도 집계에서는 제외된다.
#      확정된 지점은 기상청 API허브 실제 응답으로 존재를 확인한 station id를 사용했다
#      (지점명 매칭은 기상청 공개 관측지점 코드 기준 — 정식 지점정보 API 연동 전까지는 참고용).
# lat/lon: 최근접 관측지점 판단용 도시 대표좌표 (지사 사무실 도시는 지도 핀 위치로도 사용).
# office: true인 도시가 지사 사무실 소재지 — 지도의 메인 핀은 이 도시에 고정한다.
# site_count: 그 도시에 있는 사업장(주소) 개수. 지도에서 사무실 외 도시를 "부속 사업장" 막대로
#             표시할지 판단하는 기준(2개 이상일 때 자동 표시)으로 쓰인다.
# satellite: true면 site_count와 무관하게 수동으로 부속 막대 표시를 강제한다(2026-07-31 지정).

branches:
  - name: 경인  # 경기+인천 통합 (2026-07-31: 경기→경인 개칭, 인천지사 별도운영 폐지·통합)
    cities:
      - name: 의왕
        lat: 37.3444
        lon: 126.9683
        stn: null
        office: true  # 지사 사무실 (경기도 의왕시 창말로 39)
        site_count: 1
      - name: 안성
        lat: 37.0079
        lon: 127.2795
        stn: null
        site_count: 3  # 수도권 제1·2·3물류센터
      - name: 인천
        lat: 37.4563
        lon: 126.7052
        stn: 112  # 인천(ASOS)
        site_count: 1
      - name: 평택
        lat: 36.9921
        lon: 127.1129
        stn: null
        site_count: 1

  - name: 광양
    cities:
      - name: 광양
        lat: 34.9407
